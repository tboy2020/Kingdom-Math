<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Math Dashboard 📊</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:linear-gradient(160deg,#0a0a1a 0%,#13132a 60%,#0a0a1a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.nav{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.4);border-bottom:2px solid rgba(108,99,255,.25);position:sticky;top:0;z-index:300}
.nav-title{font-family:'Fredoka One',cursive;font-size:17px;color:#a5b4fc}
.nav-btn{background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.3);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800;color:#a5b4fc;cursor:pointer;text-decoration:none;font-family:'Nunito',sans-serif}
.wrap{width:100%;max-width:460px;padding:16px 14px 60px;display:flex;flex-direction:column;gap:14px}

.hero{text-align:center;padding:8px 0}
.hero-icon{font-size:56px}
.hero-title{font-family:'Fredoka One',cursive;font-size:26px;color:#a5b4fc;margin-top:4px}
.hero-sub{font-size:13px;color:#888;margin-top:2px}

.empty{background:rgba(255,255,255,.05);border:2px dashed rgba(108,99,255,.3);border-radius:18px;padding:30px 20px;text-align:center;color:#888;font-size:14px;line-height:1.7}

/* CHILD CARD */
.child-card{background:rgba(255,255,255,.06);border:2px solid rgba(108,99,255,.25);border-radius:20px;padding:16px;margin-bottom:4px}
.child-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.child-avatar{font-size:40px}
.child-name{font-family:'Fredoka One',cursive;font-size:22px;color:#a5b4fc}
.child-meta{font-size:12px;color:#888;margin-top:1px}

.stat-strip{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:10px;text-align:center}
.stat-num{font-family:'Fredoka One',cursive;font-size:24px}
.stat-num.correct{color:#4ade80}
.stat-num.wrong{color:#f87171}
.stat-num.games{color:#ffd200}
.stat-lbl{font-size:10px;color:#888;text-transform:uppercase;margin-top:2px}

.section-label{font-size:12px;color:#a5b4fc;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin:10px 0 6px}

/* TOPIC BARS */
.topic-row{margin-bottom:8px}
.topic-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.topic-name{color:#ddd;font-weight:700}
.topic-count{color:#888}
.topic-bar{width:100%;height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;display:flex}
.topic-bar-correct{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e)}
.topic-bar-wrong{height:100%;background:linear-gradient(90deg,#f87171,#ef4444)}

/* GAME HISTORY */
.game-card{background:rgba(255,255,255,.04);border:1px solid rgba(108,99,255,.15);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.game-date{font-size:11px;color:#888;margin-bottom:8px}
.game-players{display:flex;flex-direction:column;gap:6px}
.gp-row{display:flex;align-items:center;gap:8px;font-size:13px}
.gp-medal{font-size:16px;flex-shrink:0}
.gp-name{font-family:'Fredoka One',cursive;color:#fff;flex:1}
.gp-rounds{font-size:11px;color:#888}
.gp-score{font-family:'Fredoka One',cursive;color:#ffd200;font-size:16px}

.tab-row{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;background:rgba(255,255,255,.06);border:2px solid rgba(108,99,255,.2);border-radius:12px;padding:10px;font-family:'Fredoka One',cursive;font-size:14px;color:#888;cursor:pointer;text-align:center;transition:all .15s}
.tab.active{background:rgba(108,99,255,.2);border-color:#a5b4fc;color:#a5b4fc}

.clear-btn{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:20px;padding:8px 18px;font-size:12px;color:#f87171;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;margin:10px auto 0;display:block}
</style>
</head>
<body>
<div class="nav">
  <a class="nav-btn" href="index.html">← Math Hub</a>
  <div class="nav-title">📊 Progress Dashboard</div>
  <span style="width:60px"></span>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-icon">📊</div>
    <div class="hero-title">Progress Dashboard</div>
    <div class="hero-sub">Competition results saved over time</div>
  </div>

  <div class="tab-row">
    <div class="tab active" id="tab-children" onclick="switchTab('children')">👧 By Child</div>
    <div class="tab" id="tab-games" onclick="switchTab('games')">🎮 Game History</div>
  </div>

  <div id="view-children"></div>
  <div id="view-games" style="display:none"></div>

  <button class="clear-btn" onclick="clearDashboard()">🗑️ Clear All Data</button>
</div>

<script>
function el(id){return document.getElementById(id);}

function loadDashboard(){
  try{ return JSON.parse(localStorage.getItem('kk_comp_dashboard') || '{}'); }
  catch(e){ return {}; }
}

var MEDALS = ['🥇','🥈','🥉','🎖️','🎖️','🎖️'];

function renderChildren(){
  var data = loadDashboard();
  var container = el('view-children');
  if(!data.children || Object.keys(data.children).length === 0){
    container.innerHTML = '<div class="empty">No games played yet!<br>Play a Math Competition and results will appear here. 🎮</div>';
    return;
  }
  var html = '';
  var names = Object.keys(data.children);
  // Sort by total correct descending
  names.sort(function(a,b){ return data.children[b].totalCorrect - data.children[a].totalCorrect; });

  names.forEach(function(name){
    var c = data.children[name];
    var avatar = c.grade === 'K' ? '⭐' : '🏆';
    html += '<div class="child-card">';
    html += '<div class="child-head"><div class="child-avatar">' + avatar + '</div>';
    html += '<div><div class="child-name">' + name + '</div>';
    html += '<div class="child-meta">' + (c.grade === 'K' ? 'Kindergarten' : '2nd Grade') + ' · ' + c.gamesPlayed + ' game' + (c.gamesPlayed !== 1 ? 's' : '') + ' played</div></div></div>';

    // Stat strip
    html += '<div class="stat-strip">';
    html += '<div class="stat"><div class="stat-num correct">' + c.totalCorrect + '</div><div class="stat-lbl">Correct</div></div>';
    html += '<div class="stat"><div class="stat-num wrong">' + c.totalWrong + '</div><div class="stat-lbl">Wrong</div></div>';
    html += '<div class="stat"><div class="stat-num games">' + (c.totalCorrect + c.totalWrong) + '</div><div class="stat-lbl">Answered</div></div>';
    html += '</div>';

    // Topics breakdown
    if(c.topics && Object.keys(c.topics).length > 0){
      html += '<div class="section-label">Topics Answered</div>';
      var topicNames = Object.keys(c.topics);
      topicNames.sort(function(a,b){
        var ta = c.topics[a].correct + c.topics[a].wrong;
        var tb = c.topics[b].correct + c.topics[b].wrong;
        return tb - ta;
      });
      topicNames.forEach(function(t){
        var tp = c.topics[t];
        var total = tp.correct + tp.wrong;
        var correctPct = total > 0 ? (tp.correct / total * 100) : 0;
        var wrongPct = total > 0 ? (tp.wrong / total * 100) : 0;
        html += '<div class="topic-row">';
        html += '<div class="topic-head"><span class="topic-name">' + t + '</span>';
        html += '<span class="topic-count">' + tp.correct + '✓ / ' + tp.wrong + '✗</span></div>';
        html += '<div class="topic-bar">';
        html += '<div class="topic-bar-correct" style="width:' + correctPct + '%"></div>';
        html += '<div class="topic-bar-wrong" style="width:' + wrongPct + '%"></div>';
        html += '</div></div>';
      });
    }
    html += '</div>';
  });
  container.innerHTML = html;
}

function renderGames(){
  var data = loadDashboard();
  var container = el('view-games');
  if(!data.games || data.games.length === 0){
    container.innerHTML = '<div class="empty">No game history yet!<br>Completed games will be listed here. 🎮</div>';
    return;
  }
  var html = '';
  // Most recent first
  var games = data.games.slice().reverse();
  games.forEach(function(g){
    var d = new Date(g.date);
    var dateStr = d.toLocaleDateString() + ' · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    html += '<div class="game-card">';
    html += '<div class="game-date">🕐 ' + dateStr + '</div>';
    html += '<div class="game-players">';
    // Sort players by score
    var sorted = g.players.slice().sort(function(a,b){ return b.score - a.score; });
    sorted.forEach(function(p, i){
      var roundsStr = p.roundScores && p.roundScores.length ? p.roundScores.join(' → ') : '';
      html += '<div class="gp-row">';
      html += '<span class="gp-medal">' + MEDALS[i] + '</span>';
      html += '<span class="gp-name">' + p.name + '</span>';
      if(roundsStr) html += '<span class="gp-rounds">R: ' + roundsStr + '</span>';
      html += '<span class="gp-score">' + p.score + '</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function switchTab(tab){
  el('tab-children').className = 'tab' + (tab === 'children' ? ' active' : '');
  el('tab-games').className = 'tab' + (tab === 'games' ? ' active' : '');
  el('view-children').style.display = tab === 'children' ? 'block' : 'none';
  el('view-games').style.display = tab === 'games' ? 'block' : 'none';
}

function clearDashboard(){
  if(confirm('Clear ALL saved competition data? This cannot be undone.')){
    try{ localStorage.removeItem('kk_comp_dashboard'); }catch(e){}
    renderChildren();
    renderGames();
    alert('Dashboard cleared.');
  }
}

// Boot
renderChildren();
renderGames();
</script>
</body>
</html>
